[package]
name = "shallowgrave-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
