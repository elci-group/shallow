schema = 1

[project]
name = "shallow"
class = "tool"
maturity = "M2"
status = "active"
description = "Shallowgrave is a Rust CLI and workspace for an immutable, content-addressable archive of software releases and their binaries. It records multi-platform manifests, verifies integrity, syncs with GitHub Releases, and tracks Cargo project builds with a daemon so deprecated versions stay findable and restorable."
